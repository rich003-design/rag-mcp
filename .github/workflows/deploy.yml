name: Deploy to Cloud Run

on:
  push:
    branches:
      - "feature/ragmcpclient"   # run only on this branch
      # - "main"                 # uncomment if you also want deploys from main branch

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: northamerica-northeast1
  SERVICE: rag-client
  REPO: rag-repo
  IMAGE: northamerica-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rag-repo/rag-client

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate with GCP (JSON key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Push Docker image
        run: |
          echo "Pushing Docker image to Artifact Registry..."
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: |
          echo "Deploying to Cloud Run..."
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --concurrency 10 \
            --max-instances 3 \
            --min-instances 0
